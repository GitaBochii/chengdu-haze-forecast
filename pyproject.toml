[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chengdu-haze-forecast"
version = "0.1.0"
description = "Reproducible Chengdu haze dissipation forecasting project"
requires-python = ">=3.11,<3.14"
readme = "README.md"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "lightgbm>=4.5,<5",
  "catboost>=1.2,<2",
  "xgboost>=2.1,<4",
  "optuna>=4,<5",
  "requests>=2.32,<3",
  "joblib>=1.4,<2",
  "streamlit>=1.38,<2",
  "plotly>=5.24,<7",
  "pyarrow>=16,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
multimodal = ["torch==2.7.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
haze_forecast = ["workbench.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
